name: Release Check

on:
  push:
    branches:
      - 'release/v*.*.*'
  pull_request:
    branches:
      - main

jobs:
  release-check:
    name: Validate release readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Validate release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/validate-release.js
